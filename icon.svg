<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#56b0f4"/>
      <stop offset="100%" stop-color="#1667ce"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff9d6"/>
      <stop offset="70%"  stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ffc836"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff1ad" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#fff1ad" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- sky -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- sun glow + sun (upper-left, peeking behind the cloud) -->
  <circle cx="189" cy="189" r="140" fill="url(#glow)"/>
  <circle cx="189" cy="189" r="74"  fill="url(#sun)"/>
  <!-- cloud shadow -->
  <g fill="#1a4284" opacity=".28" transform="translate(6,16)">
    <ellipse cx="271" cy="307" rx="86"  ry="70"/>
    <ellipse cx="181" cy="336" rx="63"  ry="53"/>
    <ellipse cx="345" cy="330" rx="66"  ry="53"/>
    <rect x="123" y="332" width="296" height="52" rx="26"/>
  </g>
  <!-- cloud (white) -->
  <g fill="#ffffff">
    <ellipse cx="271" cy="307" rx="86"  ry="70"/>
    <ellipse cx="181" cy="336" rx="63"  ry="53"/>
    <ellipse cx="345" cy="330" rx="66"  ry="53"/>
    <rect x="123" y="332" width="296" height="52" rx="26"/>
  </g>
</svg>
